name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'
      - name: Build
        run: dotnet build -c Release --nologo
      - name: Test
        # No --nologo: the test project runs on Microsoft.Testing.Platform (opted in via
        # global.json), and dotnet test forwards unrecognised flags to the test host, which
        # rejects them and reports zero tests run.
        run: dotnet test Tests/Bennewitz.Ninja.AutoVersioning.Tests/Bennewitz.Ninja.AutoVersioning.Tests.csproj -c Release
      # The release's last gate before its push, run here too, so a package that packs without
      # being declared in packages.push or packages.local fails a pull request rather than a tag.
      - name: Pack
        run: dotnet pack -c Release --no-build --nologo --output ./packages/Release
      - name: Assert packed matches declared
        run: dotnet run --file scripts/assert-packages.cs -- ./packages/Release

  # The family conventions: documentation at the root and in every top-level directory, the
  # description, topics, feature toggles and rulesets. See docs/repository-conventions.md in
  # Bennewitz.Ninja.Templates.
  #
  # ⚠ The job name is a required check in .github/repository.json. Renaming it means changing that
  # list and running `repo-conventions apply` in the same change, or every pull request blocks.
  conventions:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Check the repository conventions
        env:
          GH_TOKEN: ${{ github.token }}
        run: dotnet run --file scripts/repo-conventions.cs -- check
