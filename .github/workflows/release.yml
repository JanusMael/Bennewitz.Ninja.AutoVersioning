name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'NuGet version (e.g. 2026.2.429)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # required for NuGet.org Trusted Publishing (OIDC) — see NuGet/login below
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Resolve version and tag
        # Tag push: strip leading 'v' from the tag (e.g. v2026.2.429 → 2026.2.429)
        # Manual run: use the version input; derive tag by prepending 'v'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> $GITHUB_ENV
            echo "TAG=v${{ inputs.version }}" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
            echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          fi

      - name: Build
        run: dotnet build -c Release --nologo /p:Version=${{ env.VERSION }}

      - name: Pack
        run: dotnet pack -c Release --no-build --nologo /p:Version=${{ env.VERSION }} --output ./packages/Release

      - name: NuGet Login (Trusted Publishing)
        # Exchanges this job's GitHub OIDC token for a short-lived NuGet.org API key — no
        # long-lived NUGET_API_KEY secret to store or rotate. Requires a Trusted Publishing
        # policy on nuget.org (owner/repo/workflow filename must match this job exactly) and
        # the NUGET_USER repo secret set to the nuget.org account name tied to that policy.
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: dotnet nuget push ./packages/Release/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ env.TAG }}" \
            --title "${{ env.TAG }}" \
            --generate-notes \
            ./packages/Release/*.nupkg
