name: Release

# Triggered by a version tag (v2026.2.429), or dispatched by hand.
#
# ⛔ A PUBLISHED NUGET VERSION CAN NEVER BE REPLACED. Everything this repository otherwise
# treats as recoverable becomes permanent past the push step, so the gates below — the
# conventions, build, pack, and the packed-vs-declared check — all run before it, and
# --skip-duplicate makes a re-run of a completed release a no-op rather than a failure.

on:
  push:
    tags:
      - 'v*.*.*'
  # Two dispatch modes, decided by whether `version` is filled in:
  #
  #   BLANK    credential preflight — logs in to NuGet.org and stops. Proves the trusted-
  #            publishing policy, the id-token permission and the NUGET_USER secret all line up,
  #            and lists the ids a tag would publish, WITHOUT cutting a release.
  #   FILLED   a real release, which is the path to use when a tag already exists.
  #
  # ⚠ The preflight has to live in THIS workflow rather than one of its own: the OIDC token is
  # bound to the workflow FILENAME, so a policy naming release.yml would never match a run of any
  # other file. Every publishing step below is gated on RELEASING, so a preflight cannot publish.
  workflow_dispatch:
    inputs:
      version:
        description: 'NuGet version (e.g. 2026.2.429). LEAVE BLANK to only preflight credentials.'
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # required for NuGet.org Trusted Publishing (OIDC) — see NuGet/login below

    env:
      # Read at JOB level so the steps below can test it: a secret cannot be tested in a step's
      # own `if`, but an env value read from one can.
      NUGET_USER: ${{ secrets.NUGET_USER }}
      # A tag push is always a release; a dispatch is one only when a version was supplied.
      RELEASING: ${{ github.event_name == 'push' || inputs.version != '' }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Resolve version and tag
        # Tag push: strip leading 'v' from the tag (e.g. v2026.2.429 → 2026.2.429)
        # Manual run: use the version input; derive tag by prepending 'v'
        if: env.RELEASING == 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> $GITHUB_ENV
            echo "TAG=v${{ inputs.version }}" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
            echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          fi

      # ⛔ Fail LOUDLY rather than publish nothing quietly. Without this, a tag with the secret
      # unset skips the push (which is gated on NUGET_USER) but still creates the GitHub Release
      # below — a green run, a release page, and no package.
      - name: Refuse to release without NUGET_USER
        if: env.RELEASING == 'true' && env.NUGET_USER == ''
        run: |
          echo "::error::NUGET_USER is not set. Refusing to release: the push would be skipped"
          echo "::error::and a GitHub Release would be created for a package that never shipped."
          exit 1

      # ⛔ Nothing publishes from a repository missing what the family conventions prescribe: its
      # documents, a replaced marker, a description. Runs in the preflight too, so a dispatch with
      # the version blank reports it before a tag does. A setting that has merely drifted does not
      # stop a release; CI's `conventions` job reports that.
      - name: Refuse to release a repository the conventions reject
        env:
          GH_TOKEN: ${{ github.token }}
        run: dotnet run --file scripts/repo-conventions.cs -- check --release

      - name: Build
        if: env.RELEASING == 'true'
        run: dotnet build -c Release --nologo -p:Version=${{ env.VERSION }}

      - name: Pack
        if: env.RELEASING == 'true'
        run: dotnet pack -c Release --no-build --nologo -p:Version=${{ env.VERSION }} --output ./packages/Release

      # ⛔ The last gate before anything becomes permanent. It checks what pack ACTUALLY produced,
      # reading each id from the <id> element inside the .nuspec rather than parsing filenames,
      # against packages.push and packages.local. A package in neither list stops the run, and so
      # does a declared id that was not packed.
      - name: Assert packed matches declared
        if: env.RELEASING == 'true'
        run: dotnet run --file scripts/assert-packages.cs -- ./packages/Release

      # Kept immediately before the push: the token this returns is short-lived, and a slow step
      # in between is how it expires before it is used.
      - name: NuGet Login (Trusted Publishing)
        # Exchanges this job's GitHub OIDC token for a short-lived NuGet.org API key — no
        # long-lived NUGET_API_KEY secret to store or rotate. Requires a Trusted Publishing
        # policy on nuget.org (owner/repo/workflow filename must match this job exactly) and
        # the NUGET_USER repo secret set to the nuget.org account name tied to that policy.
        id: nuget-login
        if: env.NUGET_USER != ''
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # ⚠ A successful login proves a policy matched — NEVER that it covers every id. The exchange
      # succeeds before any package id is considered, so no preflight can detect a coverage gap.
      # The list below is read from packages.push so the comparison against nuget.org is against
      # what a tag would actually push rather than something remembered.
      - name: Report the preflight result
        if: env.RELEASING != 'true'
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::NUGET_USER is not set, so no publish would happen on a tag."
            exit 1
          fi
          ids=$(grep -v '^[[:space:]]*#' packages.push | grep -v '^[[:space:]]*$')
          echo "A v*.*.* tag will publish:"
          printf '  %s\n' $ids
          {
            echo "### Trusted publishing verified"
            echo "A \`v*.*.*\` tag will publish:"
            echo ""
            printf -- '- `%s`\n' $ids
            echo ""
            echo "Confirm ONE policy on nuget.org whose Glob Patterns cover every id above, and"
            echo "NOT a policy per id: one exchange mints one key scoped to one policy, so a second"
            echo "policy is never consulted and its package is rejected 403 — after the first is"
            echo "already permanent."
            if grep -qE '^[[:space:]]*[^#[:space:]]' packages.local 2>/dev/null; then
              echo ""
              echo "⛔ That pattern must NOT match anything in packages.local:"
              grep -v '^[[:space:]]*#' packages.local | grep -v '^[[:space:]]*$' | sed 's/^/- `/; s/$/`/'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ⚠ NAMED, NEVER GLOBBED — and driven by packages.push rather than a list repeated here, so
      # the declaration has exactly one home. A glob publishes whatever happens to be in the
      # folder, and a published version is permanent, so the one time it picks up something
      # unintended is the one time it cannot be undone.
      - name: Push to NuGet.org
        if: env.RELEASING == 'true' && env.NUGET_USER != ''
        run: |
          set -euo pipefail
          targets=()
          while IFS= read -r id; do
            targets+=("./packages/Release/${id}.${VERSION}.nupkg")
          done < <(grep -v '^[[:space:]]*#' packages.push | grep -v '^[[:space:]]*$')
          printf 'Pushing %s\n' "${targets[@]}"
          dotnet nuget push "${targets[@]}" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      # Same list, same reason. A release asset can be deleted, so a glob here fails QUIETLY —
      # which is why it is easy to leave globbed and worth not leaving globbed.
      - name: Create GitHub Release
        if: env.RELEASING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=()
          while IFS= read -r id; do
            assets+=("./packages/Release/${id}.${VERSION}.nupkg")
          done < <(grep -v '^[[:space:]]*#' packages.push | grep -v '^[[:space:]]*$')
          gh release create "${TAG}" --title "${TAG}" --generate-notes "${assets[@]}"
